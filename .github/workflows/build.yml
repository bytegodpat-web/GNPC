name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Descargar Gradle 4.9
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q gradle.zip -d "$HOME"

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/build.gradle') }}
          restore-keys: gradle-

      # Busca build.gradle aunque el proyecto esté dentro de una subcarpeta (p. ej. GNPC-main/)
      - name: Compilar
        run: |
          BG=$(find . -name build.gradle -not -path './node_modules/*' | head -n1)
          if [ -z "$BG" ]; then echo "::error::No se encontro build.gradle en el repositorio"; ls -R | head -50; exit 1; fi
          DIR=$(dirname "$BG")
          echo "Proyecto en: $DIR"
          cd "$DIR"
          set +e
          $HOME/gradle-4.9/bin/gradle build --no-daemon --console=plain > "$GITHUB_WORKSPACE/build.log" 2>&1
          CODE=$?
          set -e
          if [ $CODE -ne 0 ]; then
            echo "::error title=Resumen del fallo::$(grep -E 'error:|What went wrong|FAILED|Could not' -A2 "$GITHUB_WORKSPACE/build.log" | head -25 | tr '\n' ' ' | cut -c1-900)"
            grep -E 'error:|What went wrong|FAILED|Could not' -A3 "$GITHUB_WORKSPACE/build.log" | head -80
            tail -40 "$GITHUB_WORKSPACE/build.log"
          fi
          exit $CODE

      - name: Subir el log de compilacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: npcgemini-jar
          path: '**/build/libs/*.jar'
