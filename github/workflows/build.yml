name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Descargar Gradle 4.9
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q gradle.zip -d "$HOME"

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('build.gradle') }}
          restore-keys: gradle-

      - name: Compilar
        run: $HOME/gradle-4.9/bin/gradle setupCIWorkspace build --no-daemon --stacktrace

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: npcgemini-jar
          path: build/libs/*.jar
